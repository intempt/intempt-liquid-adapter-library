name: Build and Deploy

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  java-version: 11
  aws-region: us-east-1
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_USERNAME: ${{ secrets.GH_USERNAME }}

jobs:
  analyze:
    name: analyze
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set Up JDK ${{ env.java-version }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.java-version }}
          server-id: github
          server-username: GH_USERNAME
          server-password: GH_TOKEN

      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test
        run: mvn -B verify

      # SonarCloud needs SONAR_TOKEN (and sonar.organization); the repo has no token, so the
      # scan only runs when one is configured instead of failing every build.
      - name: Check for a Sonar token
        id: sonar
        run: echo "configured=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Analyze
        if: steps.sonar.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=intempt_common-library